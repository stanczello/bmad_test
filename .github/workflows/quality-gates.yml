name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  client-quality:
    name: Client Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emotional-aquarium-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: emotional-aquarium-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Coverage (70% enforced)
        run: npm run test:coverage

  server-quality:
    name: Server Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emotional-aquarium-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: emotional-aquarium-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Coverage (70% enforced)
        run: npm run test:coverage

  server-playwright:
    name: Server Playwright E2E
    runs-on: ubuntu-latest
    needs: server-quality
    defaults:
      run:
        working-directory: emotional-aquarium-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: emotional-aquarium-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
